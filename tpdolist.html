<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
    <link rel="stylesheet" href="todolist.css">
    <script src="todolist.js" defer></script>
</head>
<body>
    <section class="hero">
        <h1 class="hero__title">Todo list</h1>
        <div class="hero__div">
            <input id="input" type="text" class="hero__input" placeholder="Enter todo">
            <button id="addBtn" class="hero__btn">Add</button>
        </div>
        <p id="message" class="hero__message">
            There are no tasks yet!
        </p>
        <ui id="taskList" class="hero__list"></ui>
    </section>
    
</body>
</html>
